# promtool unit tests for DistantSignalRetentionStepFailing (see
# recorded-alerts.yaml's header for how rules.yaml is rendered). Defaults:
# at least 2 errors of one task within 2h. Retention runs every 60s; the
# counters are registered at 0, so every series starts at 0.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # history fails on two consecutive passes (10m and 11m): fires. trains
  # fails once at 5m and never again: quiet. daily_stats never fails.
  - interval: 1m
    input_series:
      - series: 'distant_signal_aggregator_retention_errors_total{namespace="distant-signal", pod="a", task="history"}'
        values: '0x9 1 2x30'
      - series: 'distant_signal_aggregator_retention_errors_total{namespace="distant-signal", pod="a", task="trains"}'
        values: '0x4 1x35'
      - series: 'distant_signal_aggregator_retention_errors_total{namespace="distant-signal", pod="a", task="daily_stats"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: DistantSignalRetentionStepFailing
        exp_alerts: []
      - eval_time: 12m
        alertname: DistantSignalRetentionStepFailing
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, task: history}
            exp_annotations:
              summary: aggregator retention step history failing (2 in 2h)
              description: "Its rows stop being pruned (some are licensing deadlines); the other steps still run. See the aggregator's log."
              runbook_url: https://github.com/Distant-Signal/ds-deploy/blob/main/docs/alerts.md#distantsignalretentionstepfailing

  # A single failure in a long-running pod, with the window fully covered
  # by samples: quiet.
  # Two failures an hour apart: fires.
  - interval: 1m
    input_series:
      - series: 'distant_signal_aggregator_retention_errors_total{namespace="distant-signal", pod="a", task="trust_event_backlog"}'
        values: '0x179 1x60'
      - series: 'distant_signal_aggregator_retention_errors_total{namespace="distant-signal", pod="a", task="schedule_services"}'
        values: '0x149 1x60 2x30'
    alert_rule_test:
      - eval_time: 200m
        alertname: DistantSignalRetentionStepFailing
        exp_alerts: []
      - eval_time: 235m
        alertname: DistantSignalRetentionStepFailing
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, task: schedule_services}
            exp_annotations:
              summary: aggregator retention step schedule_services failing (2 in 2h)
              description: "Its rows stop being pruned (some are licensing deadlines); the other steps still run. See the aggregator's log."
              runbook_url: https://github.com/Distant-Signal/ds-deploy/blob/main/docs/alerts.md#distantsignalretentionstepfailing

  # DistantSignalPinnedTrainDataLost: the gauge above 0 for 6h. kind=darwin
  # goes to 2 at 1m and stays: pending before 6h1m, firing after.
  # kind=boards stays 0: quiet.
  - interval: 1m
    input_series:
      - series: 'distant_signal_aggregator_pinned_trains_missing_data{namespace="distant-signal", pod="a", kind="darwin"}'
        values: '0 2x599'
      - series: 'distant_signal_aggregator_pinned_trains_missing_data{namespace="distant-signal", pod="a", kind="boards"}'
        values: '0x600'
    alert_rule_test:
      - eval_time: 5h
        alertname: DistantSignalPinnedTrainDataLost
        exp_alerts: []
      - eval_time: 7h
        alertname: DistantSignalPinnedTrainDataLost
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, kind: darwin}
            exp_annotations:
              summary: pinned trains missing darwin data (2)
              description: "Bound trains lack data past retention, or a bound leg lost its train before a snapshot. Nothing is deleted; see the aggregator's ERROR logs."
              runbook_url: https://github.com/Distant-Signal/ds-deploy/blob/main/docs/alerts.md#distantsignalpinnedtraindatalost

  # The bound-legs arm: only state=unsnapshotted counts, under kind
  # legs_no_train. 1 at 1m: firing after 6h1m. snapshotted
  # never alerts on its own.
  - interval: 1m
    input_series:
      - series: 'distant_signal_aggregator_bound_legs_without_train{namespace="distant-signal", pod="a", state="unsnapshotted"}'
        values: '0 1x599'
      - series: 'distant_signal_aggregator_bound_legs_without_train{namespace="distant-signal", pod="a", state="snapshotted"}'
        values: '5x600'
    alert_rule_test:
      - eval_time: 5h
        alertname: DistantSignalPinnedTrainDataLost
        exp_alerts: []
      - eval_time: 7h
        alertname: DistantSignalPinnedTrainDataLost
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, kind: legs_no_train}
            exp_annotations:
              summary: pinned trains missing legs_no_train data (1)
              description: "Bound trains lack data past retention, or a bound leg lost its train before a snapshot. Nothing is deleted; see the aggregator's ERROR logs."
              runbook_url: https://github.com/Distant-Signal/ds-deploy/blob/main/docs/alerts.md#distantsignalpinnedtraindatalost

  # DistantSignalIrishHistoryForcedPrune: any increase within 1d. The
  # counter steps from 0 to 3 at 10m on table ioi_x and stays; the other
  # table never moves.
  - interval: 1m
    input_series:
      - series: 'distant_signal_ingest_writer_ioi_history_forced_total{namespace="distant-signal", pod="w", table="ioi_x"}'
        values: '0x9 3x50'
      - series: 'distant_signal_ingest_writer_ioi_history_forced_total{namespace="distant-signal", pod="w", table="ioi_y"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: DistantSignalIrishHistoryForcedPrune
        exp_alerts: []
      - eval_time: 30m
        alertname: DistantSignalIrishHistoryForcedPrune
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, table: ioi_x}
            exp_annotations:
              summary: tracked Irish history force-pruned (ioi_x)
              description: "Rows a tracked journey held went past the 600-day bound. See the ingest-writer's WARN log."
              runbook_url: https://github.com/Distant-Signal/ds-deploy/blob/main/docs/alerts.md#distantsignalirishhistoryforcedprune

  # The series appears only after the first forced delete: a table that
  # starts at 4 at 10m (no earlier sample) still fires.
  - interval: 1m
    input_series:
      - series: 'distant_signal_ingest_writer_ioi_history_forced_total{namespace="distant-signal", pod="w", table="ioi_z"}'
        values: '_x9 4x50'
    alert_rule_test:
      - eval_time: 5m
        alertname: DistantSignalIrishHistoryForcedPrune
        exp_alerts: []
      - eval_time: 30m
        alertname: DistantSignalIrishHistoryForcedPrune
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, table: ioi_z}
            exp_annotations:
              summary: tracked Irish history force-pruned (ioi_z)
              description: "Rows a tracked journey held went past the 600-day bound. See the ingest-writer's WARN log."
              runbook_url: https://github.com/Distant-Signal/ds-deploy/blob/main/docs/alerts.md#distantsignalirishhistoryforcedprune
