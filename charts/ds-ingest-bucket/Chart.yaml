apiVersion: v2
name: ds-ingest-bucket
description: >-
  The Google Cloud Storage landing zone for Distant Signal's schedule feed: a
  dedicated bucket the Rail Data Marketplace pushes the CIF timetable and
  CORPUS files into, bucket-level IAM bindings for the publisher's service
  accounts and for schedule-ingest's reader, an audit-log bucket, and
  optional usage alerts and Pub/Sub object notifications. Renders Crossplane
  v2 namespaced managed resources (crossplane-contrib/provider-upjet-gcp),
  so installing it needs Crossplane and the GCP providers and their CRDs.
  `helm template` and `helm lint` work without them. Off by default
  (`enabled: false`).
  Design: docs/superpowers/specs/2026-10-02-schedule-feed-gcs-landing-design.md.
type: application

# Bump by hand for any template/values change, as charts/distant-signal does.
# 0.2.0: the move from AWS S3 (ACK) to Google Cloud Storage (Crossplane).
# 0.2.1: AlertPolicy documentation is an object, as the CRD requires.
# 0.2.2: AGPL-3.0-or-later (LICENSE, annotation).
# 0.3.0: published at ghcr.io/distant-signal/charts after the repository
#   transfer (repo split phase 1).
# 0.4.0: packaged and pushed by Distant-Signal/ds-deploy (repo split phase
#   5). A new base so this repository's builds, from run 1, order above the
#   monorepo's.
version: 0.4.0

# Not an application image: the chart deploys no workload. Kept at the
# version of the design it implements.
appVersion: "0.2.0"

kubeVersion: ">=1.23.0-0"

# Helm's Chart.yaml has no licence field. LICENSE, next to this file, is
# the AGPL text and ships in the packaged chart.
annotations:
  artifacthub.io/license: AGPL-3.0-or-later

home: https://github.com/Distant-Signal/ds-deploy
sources:
  - https://github.com/Distant-Signal/ds-deploy

# No dependencies: Crossplane and its GCP providers are cluster components
# owned by Ranma-Config, not subcharts of this chart.
