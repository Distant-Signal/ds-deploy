apiVersion: v2
name: distant-signal
description: >-
  National Rail status stack: PostgreSQL, Redis, the api, the aggregator,
  the enricher, the notifier, the frontend and the TRUST movement-stream
  consumers, plus optional pollers (four Rail Data Marketplace, TfL, and
  three island-of-Ireland), movement-relay and the CIF schedule-feed pod,
  mirroring the topology of the repository's docker-compose.yml.
type: application

# Chart version BASE: bumped by hand, only for chart changes (templates,
# values shape, schema); a Renovate image bump doesn't bump it. CI
# (chart.yml, through Distant-Signal/ci's helm-chart.yml) appends build
# metadata on every push to main, `<base>+build.<run>.sha.<short sha>`, so
# every push is a new, immutable, ordered chart tag.
# 0.4.0: scheduleFeed.sftp.enabled and the GCS bucket source (scheduleFeed.bucket), both opt-in.
# 0.4.1: pod templates carry only release-stable labels (distant-signal.podLabels).
# 0.4.2: AGPL-3.0-or-later (LICENSE, annotation) and sourceCode, the api's /public/version.
# 0.5.0: images at ghcr.io/distant-signal/images/<service>; the chart moves to
#   ghcr.io/distant-signal/charts after the repository transfer (repo split
#   phase 1). A new base so builds order above the old run counter.
# 0.5.1: /public/version takes an image's commit from its build tag
#   (build.<run>-<commit>), so ds-deploy can pin each image separately.
# 0.6.0: packaged and pushed by Distant-Signal/ds-deploy, with every image
#   pinned by tag and digest in values.yaml (repo split phase 5). A new
#   base so this repository's builds, from run 1, order above the
#   monorepo's.
# 0.6.1: /public/version names each image's own repository (image.source),
#   and lists ds-migrate at its release tag while migrate.job.enabled.
version: 0.6.1

# CI sets appVersion to `sha-<short sha>` of the ds-deploy commit it packages
# (`helm package --app-version`). No first-party image falls back to it:
# each is pinned by digest in values.yaml. This static value is only seen
# when packaging or templating straight from a checkout.
appVersion: "0.1.0"

# templates/networkpolicy.yaml selects the ingress-controller namespace via
# the automatic `kubernetes.io/metadata.name` label, which is GA from 1.22.
kubeVersion: ">=1.23.0-0"

# Helm's Chart.yaml has no licence field. LICENSE, next to this file, is
# the AGPL text and ships in the packaged chart.
annotations:
  artifacthub.io/license: AGPL-3.0-or-later

home: https://github.com/Distant-Signal/ds-deploy
sources:
  - https://github.com/Distant-Signal/ds-deploy
  - https://github.com/Distant-Signal/distant-signal

# Deliberately no `dependencies:` — the chart bundles its own PostgreSQL
# StatefulSet rather than pulling a subchart, so `helm dependency update` is
# never needed and the chart installs in an air-gapped cluster.
