apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distant-signal.frontendFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "frontend") | nindent 4 }}
{{- /*
Graceful shutdown budget: the preStop sleep (endpoint removal reaches
kube-proxy and cloudflared's connections), then Next's own drain after
SIGTERM, inside terminationGracePeriodSeconds with 10 s to spare.
*/ -}}
{{- $preStopSleep := int (.Values.frontend.preStopSleepSeconds | default 0) }}
{{- $grace := int (.Values.frontend.terminationGracePeriodSeconds | default 30) }}
{{- if lt $preStopSleep 0 }}
{{- fail (printf "frontend.preStopSleepSeconds must not be negative, got %d." $preStopSleep) }}
{{- end }}
{{- if gt (add $preStopSleep 10) $grace }}
{{- fail (printf "frontend.terminationGracePeriodSeconds (%d) must be at least frontend.preStopSleepSeconds (%d) + 10, or the kubelet kills the frontend mid-drain." $grace $preStopSleep) }}
{{- end }}
{{- $replicas := int .Values.frontend.replicaCount }}
spec:
  revisionHistoryLimit: {{ include "distant-signal.revisionHistoryLimit" $ }}
  replicas: {{ $replicas }}
  # Never take the only ready pod away: surge one new pod, wait for it to be
  # ready, then remove an old one (what the 25%/25% default rounds to on one
  # replica, made explicit so a changed replica count cannot change it).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.frontend.strategy.maxSurge }}
      maxUnavailable: {{ .Values.frontend.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.podLabels" (dict "root" . "component" "frontend") | nindent 8 }}
      {{- with .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $grace }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.frontend.podSecurityContext) | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            # readOnlyRootFilesystem is FALSE here, and only here. `next start`
            # writes its incremental cache under .next/cache at runtime, so a
            # read-only root filesystem makes this container fail on first
            # render. Every other workload in this chart is read-only.
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.frontendEnv" .) "extra" .Values.frontend.extraEnv) | trim | nindent 12 }}
          {{- if .Values.frontend.probes.startup.enabled }}
          # Readiness and liveness begin only once this passes, so a slow
          # start (cold node, image just pulled) is not killed by liveness.
          startupProbe:
            httpGet:
              path: {{ .Values.frontend.probes.path }}
              port: http
            periodSeconds: {{ .Values.frontend.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.frontend.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.frontend.probes.startup.timeoutSeconds }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.path }}
              port: http
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.frontend.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.frontend.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.path }}
              port: http
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.frontend.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.frontend.probes.liveness.timeoutSeconds }}
          {{- if gt $preStopSleep 0 }}
          # Before SIGTERM: lets the endpoint removal reach kube-proxy and
          # cloudflared's connections, so no new request arrives once Next
          # stops accepting. The image is node:*-bookworm-slim, so `sleep`
          # exists (frontend/Dockerfile, runtime-prod).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ $preStopSleep | quote }}]
          {{- end }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.frontend.affinity }}
      affinity:
        {{- toYaml .Values.frontend.affinity | nindent 8 }}
      {{- else if gt $replicas 1 }}
      # Preferred, never required: on a single node a required rule would
      # leave the second replica Pending. With several nodes the replicas
      # spread; with one they share it.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "distant-signal.selectorLabels" (dict "root" . "component" "frontend") | nindent 20 }}
      {{- end }}

{{- /*
This container's own env entries. distant-signal.mergeEnv renders them
with frontend.extraEnv, which replaces an entry of the same name.
*/ -}}
{{- define "distant-signal.frontendEnv" }}
            - name: API_BASE_URL
              value: {{ default (include "distant-signal.apiBaseUrl" .) .Values.frontend.apiBaseUrl | quote }}
            # frontend/lib/siteOrigin.ts's own preferred source for
            # share/invite links and same-origin checks -- falls back to
            # the request's own Host header (with a one-time warning) when
            # empty, so leaving this unset does not break anything, just
            # loses the guarantee that those links use the deployment's
            # real public hostname rather than whatever Host header a
            # request happened to arrive with. 2026-09-25 Signal Box Audit
            # Low finding: declared and read by the frontend since the
            # site-origin work landed, but never wired into this chart --
            # masked in every environment so far by the graceful fallback,
            # not a working equivalent default.
            - name: NEXT_PUBLIC_SITE_URL
              value: {{ include "distant-signal.frontendSiteUrl" . | quote }}
            # frontend/lib/legal.ts: publishes the draft legal pages. Read
            # per request, so no image rebuild is needed to flip it.
            - name: LEGAL_PAGES_PUBLISHED
              value: {{ .Values.frontend.legalPagesPublished | toString | quote }}
            # frontend/lib/legal.ts: the operator's details for those pages
            # (frontend.legal.*), read per request. An empty value is left
            # out, which the frontend reads as unset (pages stay 404, or
            # the default minimum age of 18).
            {{- with .Values.frontend.legal }}
            {{- with .operatorName }}
            - name: LEGAL_OPERATOR_NAME
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with .contactEmail }}
            - name: LEGAL_CONTACT_EMAIL
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with .ssoLogRetention }}
            - name: LEGAL_SSO_LOG_RETENTION
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with .lastUpdated }}
            - name: LEGAL_LAST_UPDATED
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with .icoRegistration }}
            - name: LEGAL_ICO_REGISTRATION
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with .minimumAge }}
            - name: LEGAL_MINIMUM_AGE
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with .hostingProvider }}
            - name: LEGAL_HOSTING_PROVIDER
              value: {{ . | toString | quote }}
            {{- end }}
            {{- end }}
            # frontend/lib/legal.ts retentionPolicy(): the privacy notice
            # states the api's own retention settings, so they are copied
            # from the api values rather than set twice (LEG-28, DQ7).
            - name: RETENTION_PAST_TRAVEL_DAYS
              value: {{ .Values.api.pastTravelRetentionDays | int | toString | quote }}
            - name: RETENTION_STALE_PUSH_SUBSCRIPTION_DAYS
              value: {{ .Values.api.stalePushSubscriptionDays | int | toString | quote }}
            - name: RETENTION_INACTIVE_ACCOUNT_DAYS
              value: {{ .Values.api.inactiveAccountRetentionDays | int | toString | quote }}
            - name: RETENTION_REGULAR_JOURNEY_DAYS
              value: {{ .Values.api.regularJourneyRetentionDays | int | toString | quote }}
            {{- if eq (toString (dig "recentlyDeleted" "enabled" false .Values.api)) "true" }}
            # The Recently deleted grace period, validated (7 to 31) like the
            # api's own copy of it. Only while api.recentlyDeleted.enabled is
            # true: with it off the api deletes at once, and the privacy
            # notice must not describe a grace period (absent = no sentence).
            - name: RETENTION_RECENTLY_DELETED_DAYS
              value: {{ include "distant-signal.recentlyDeletedRetentionDays" . | quote }}
            {{- end }}
            {{- if .Values.railMcp.enabled }}
            # The in-app chat's link to the separately-deployed derived MCP
            # service -- absent, correctly, when railMcp is disabled. Only
            # the browser talks to that service (the old server-to-server
            # consent bridge, RAILMCP_BASE_URL/RAILMCP_INTERNAL_COMPLETE_TOKEN,
            # was retired on 2026-09-29 once the MCP service became its own
            # Authentik OIDC client).
            #
            # Read at request time, not build time. Next inlines a literal
            # `process.env.NEXT_PUBLIC_*` reference at `next build` (in client
            # AND server code), and the image is built without this value, so
            # every reader goes through lib/csp.ts's runtimeRailMcpPublicUrl(),
            # which looks the name up indirectly: proxy.ts (CSP connect-src),
            # the /connect-claude page, and the /chat and /chat/callback
            # Server Components, which pass it to their Client Components as
            # a prop. No build-time bake is needed.
            - name: NEXT_PUBLIC_RAILMCP_PUBLIC_URL
              value: {{ .Values.railMcp.publicUrl | quote }}
            {{- end }}
{{- end }}
