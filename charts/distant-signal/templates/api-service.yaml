apiVersion: v1
kind: Service
metadata:
  name: {{ include "distant-signal.apiFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "distant-signal.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
{{- if include "distant-signal.delegatedEnabled" . }}
---
# The delegated listener's own Service (api.delegated; decision D-14 of the
# delegated-access spec). Always ClusterIP, whatever api.service.type is:
# the Ingress and the tunnel route to the Service above, so a public request
# can never reach the only port that accepts delegated bearers. ds-mcp calls
# http://<this name>.<namespace>.svc:<port> for the delegated routes.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distant-signal.apiDelegatedFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: delegated
      port: {{ include "distant-signal.delegatedPort" . }}
      targetPort: delegated
      protocol: TCP
  selector:
    {{- include "distant-signal.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
{{- end }}
{{- if include "distant-signal.personalTokensEnabled" . }}
---
# The personal-token listener's own Service (api.personalTokens;
# docs/specs/personal-api-tokens.md §3). Always ClusterIP, whatever
# api.service.type is. The tunnel routes the API hostname here, and the
# NetworkPolicy admits only the tunnel connector
# (networkPolicy.tunnel.tokenApi). It reaches the token listener alone,
# never the api's main port.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distant-signal.apiTokensFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: tokens
      port: {{ include "distant-signal.personalTokensPort" . }}
      targetPort: tokens
      protocol: TCP
  selector:
    {{- include "distant-signal.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
{{- end }}
