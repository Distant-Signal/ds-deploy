{{- if .Values.pollerIrishRailLive.enabled }}
{{- /* Its only sink is its stream: its own narrow Redis user (security review H3). */}}
{{- include "distant-signal.requireOwnRedisUser" (dict "root" . "client" "pollerIrishRailLive" "what" "pollerIrishRailLive.enabled") }}
{{- $rollout := include "distant-signal.pollerRollout" (dict "what" "pollerIrishRailLive.rollout" "rollout" .Values.pollerIrishRailLive.rollout) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-poller-irish-rail-live" (include "distant-signal.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "poller-irish-rail-live") | nindent 4 }}
spec:
  revisionHistoryLimit: {{ include "distant-signal.revisionHistoryLimit" $ }}
  replicas: 1
  # pollerIrishRailLive.rollout (distant-signal.pollerRollout).
  {{- include "distant-signal.pollerStrategy" $rollout | nindent 2 }}
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "poller-irish-rail-live") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.podLabels" (dict "root" . "component" "poller-irish-rail-live") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.pollerIrishRailLive.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.pollerIrishRailLive.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.pollerIrishRailLive.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.pollerIrishRailLive.podSecurityContext) | nindent 8 }}
      containers:
        - name: poller-irish-rail-live
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.pollerIrishRailLive.image) | quote }}
          imagePullPolicy: {{ .Values.pollerIrishRailLive.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # SVC-08/INF-9: /livez restarts a wedged poll loop. Under rollout
          # surge, readiness (/healthz) gates the rollout: nothing routes
          # traffic to a poller.
          {{- include "distant-signal.workerHealthProbes" (dict "root" . "port" .Values.workerHealth.port "readiness" (eq $rollout "surge")) | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ .Values.workerHealth.port }}
              protocol: TCP
          {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.pollerIrishRailLive.metricsPort }}
              protocol: TCP
          {{- end }}
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.pollerIrishRailLiveEnv" (dict "root" . "surge" (eq $rollout "surge"))) "extra" .Values.pollerIrishRailLive.extraEnv) | trim | nindent 12 }}
          {{- with .Values.pollerIrishRailLive.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.pollerIrishRailLive.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pollerIrishRailLive.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pollerIrishRailLive.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /*
This container's own env entries. distant-signal.mergeEnv renders them
with pollerIrishRailLive.extraEnv, which replaces an entry of the same name.
Takes (dict "root" $ "surge" <rollout surge>).
*/ -}}
{{- define "distant-signal.pollerIrishRailLiveEnv" }}
{{- $root := .root }}
            - name: IRISH_RAIL_BASE_URL
              value: {{ $root.Values.pollerIrishRailLive.irishRailBaseUrl | quote }}
            # Ingest plan 3c.2 (decision D8): the only sink is the
            # ds:ingest:ioi-live stream (the ingest-writer applies
            # it with ingestWriter.streams.ioi-live), as the
            # poller-irish-rail-live ACL user with redis.acl.clients.pollerIrishRailLive.
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" $root | quote }}
            {{- include "distant-signal.redisClientAuthEnv" (dict "root" $root "client" "pollerIrishRailLive" "user" "poller-irish-rail-live") }}
            - name: POLL_INTERVAL_SECS
              value: {{ $root.Values.pollerIrishRailLive.pollIntervalSecs | quote }}
            {{- if $root.Values.pollerIrishRailLive.stationCodesOverride }}
            - name: STATION_CODES_OVERRIDE
              value: {{ $root.Values.pollerIrishRailLive.stationCodesOverride | quote }}
            {{- end }}
            - name: METRICS_ENABLED
              value: {{ $root.Values.metrics.enabled | quote }}
            {{- if $root.Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ $root.Values.pollerIrishRailLive.metricsPort | quote }}
            {{- end }}
            # /livez + /healthz listener (SVC-08/INF-9) -- see workerHealth.
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int $root.Values.workerHealth.port) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ $root.Values.pollerIrishRailLive.progressStallSecs | quote }}
            {{- if .surge }}
            {{- with include "distant-signal.pollerReadyFallbackSecs" $root }}
            # Rollout surge: /healthz turns ready at the first successful
            # cycle, or this long after the start whatever the cycles do
            # (unset: the binary's 480 s).
            - name: POLLER_READY_FALLBACK_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: RUST_LOG
              value: {{ $root.Values.pollerIrishRailLive.logLevel | quote }}
{{- end }}
