apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-aggregator" (include "distant-signal.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "aggregator") | nindent 4 }}
spec:
  # Fixed at 1 -- see the comment above `aggregator:` in values.yaml.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a rolling update would briefly run two
    # aggregators, double-writing line_status and racing the history prune.
    type: Recreate
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "aggregator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "aggregator") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.aggregator.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.aggregator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.aggregator.podSecurityContext) | nindent 8 }}
      containers:
        - name: aggregator
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.aggregator.image) | quote }}
          imagePullPolicy: {{ .Values.aggregator.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # SVC-08/INF-9/INF-5: /livez restarts a wedged loop; /healthz keeps
          # the pod NotReady until the initial Postgres connection is up.
          {{- include "distant-signal.workerHealthProbes" (dict "root" . "port" .Values.workerHealth.port "readiness" true) | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ .Values.workerHealth.port }}
              protocol: TCP
          {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          env:
            {{- include "distant-signal.databaseEnv" . | nindent 12 }}
            # Always rendered, unlike the port env var below: this is
            # the Rust-side toggle that actually stops the binary from
            # starting its /metrics listener (`metrics_enabled` in
            # crates/aggregator/src/config.rs). Omitting the port/env/annotations
            # alone would not -- Kubernetes container ports are purely
            # declarative -- so this must render "false" too, not vanish.
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
            # Matches the binary's own default (crates/aggregator/src/config.rs)
            # and where docker/aggregator.Dockerfile bakes the catalogue in.
            - name: LINES_DIR
              value: /app/lines
            - name: POLL_INTERVAL_SECS
              value: {{ .Values.aggregator.pollIntervalSecs | quote }}
            - name: HISTORY_RETENTION_DAYS
              value: {{ .Values.aggregator.historyRetentionDays | quote }}
            - name: DAILY_STATS_RETENTION_DAYS
              value: {{ .Values.aggregator.dailyStatsRetentionDays | quote }}
            - name: HALF_HOURLY_STATS_RETENTION_HOURS
              value: {{ .Values.aggregator.halfHourlyStatsRetentionHours | quote }}
            # See Config::trust_event_backlog_retention_days's own doc
            # comment (crates/aggregator/src/config.rs) and
            # aggregator.trustEventBacklogRetentionDays's own comment
            # below (values.yaml) for the licensing safeguard this
            # default (1) exists to enforce -- do not bump this chart
            # default without that confirmation happening first.
            - name: TRUST_EVENT_BACKLOG_RETENTION_DAYS
              value: {{ .Values.aggregator.trustEventBacklogRetentionDays | quote }}
            # NOT a licensing safeguard, unlike the setting directly above --
            # keeps GET /public/trains/search's 7-day backward search
            # window intact with a 1-day safety margin. See
            # Config::schedule_destination_departures_retention_days
            # (crates/aggregator/src/config.rs) for why the default is 8.
            - name: SCHEDULE_DESTINATION_DEPARTURES_RETENTION_DAYS
              value: {{ .Values.aggregator.scheduleDestinationDeparturesRetentionDays | quote }}
            - name: TRAINS_RETENTION_DAYS
              value: {{ .Values.aggregator.trainsRetentionDays | quote }}
            # Shorter tier for a trains row with NO train_subscriptions
            # row referencing it -- see aggregator.untrackedTrainsRetentionDays's
            # own comment above (values.yaml) and
            # Config::untracked_trains_retention_days
            # (crates/aggregator/src/config.rs). A tracked train still
            # keeps TRAINS_RETENTION_DAYS above regardless of this value.
            - name: UNTRACKED_TRAINS_RETENTION_DAYS
              value: {{ .Values.aggregator.untrackedTrainsRetentionDays | quote }}
            # Global override for LineDefinition.full_coverage_enabled --
            # see aggregator.fullCoverageEnabledDefault's own comment in
            # values.yaml. Default false; must be set the same on the api
            # Deployment (api.fullCoverageEnabledDefault) to actually flip
            # full coverage on everywhere, since both services independently
            # gate on this.
            - name: FULL_COVERAGE_ENABLED_DEFAULT
              value: {{ .Values.aggregator.fullCoverageEnabledDefault | quote }}
            # Windowed full-coverage severity: off unless
            # aggregator.fullCoverageWindow.mode says otherwise.
            - name: FULL_COVERAGE_WINDOW_MODE
              value: {{ .Values.aggregator.fullCoverageWindow.mode | quote }}
            - name: FULL_COVERAGE_WINDOW_ENFORCE_LINES
              value: {{ .Values.aggregator.fullCoverageWindow.enforceLines | quote }}
            - name: FULL_COVERAGE_WINDOW_MIN_ESCALATION_RANK
              value: {{ .Values.aggregator.fullCoverageWindow.minEscalationRank | quote }}
            - name: FULL_COVERAGE_WINDOW_STATS_RETENTION_DAYS
              value: {{ .Values.aggregator.fullCoverageWindow.retentionDays | quote }}
            {{- /* Optional cold archive (archive.* in values.yaml): nothing at
            all is rendered here when archive.enabled is false. */}}
            {{- if .Values.archive.enabled }}
            {{- include "distant-signal.archiveEnv" . | nindent 12 }}
            {{- end }}
            # /livez + /healthz listener (SVC-08/INF-9) -- see workerHealth.
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.workerHealth.port) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ .Values.aggregator.progressStallSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.aggregator.logLevel | quote }}
            {{- with .Values.aggregator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.aggregator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.aggregator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aggregator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aggregator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
