# A filled-in "real deployment" example with every feature this chart can
# turn on: all five pollers, the island-of-Ireland feeds, the ingest-writer,
# the Redis ACL and the per-service Postgres roles. It renders against the
# current chart, including its ingest preflight. The images are the chart's
# own (values.yaml pins every one by tag and digest from
# ghcr.io/distant-signal/images), so nothing here overrides one.
#
# Render it with no cluster, from a checkout:
#
#   helm template distant-signal charts/distant-signal \
#     -f charts/distant-signal/values-example.yaml
#
# or from the published, cosign-signed chart:
#
#   helm template distant-signal oci://ghcr.io/distant-signal/charts/distant-signal \
#     --version <chart version> -f values-example.yaml
#
# Other starting points: values-minimal.yaml is the smallest install that
# renders with no external service (no LLM, no Kafka, no RDM key), and
# values-production-example.yaml is the layout of a real single-node
# deployment (sizing, role and ACL layout, existingSecret references).
# docs/first-install.md lists the Secrets and objects an install expects, in
# order.
#
# Every RDM base URL below is a placeholder host. Replace them, and the API
# keys, with the real product URLs and keys from your Rail Data Marketplace
# subscription before installing this for real (production runs all four RDM
# pollers; see local.env.example in the repository root). The `replace-...`
# values are placeholders, not credentials: put real ones in existingSecret
# Secrets rather than in a values file.

api:
  replicaCount: 2
  logLevel: info
  database:
    # Two replicas at the default pool of 50 (plus a RollingUpdate surge
    # pod's) all count against the bundled Postgres's max_connections of
    # 200 (197 usable) alongside the other pools; 30 keeps the headroom
    # for more replicas. The chart refuses to render a layout that doesn't
    # fit (INF-7).
    maxConnections: 30
  # Required -- the api will not render, let alone start, without these.
  # Note redirectUrl points at the FRONTEND host (status.example.com, the
  # same host the ingress section below publishes), not at the api: the
  # session cookie the callback sets must be scoped to the origin the
  # browser uses for everything else.
  sso:
    issuerUrl: https://sso.example.com/realms/rail
    clientId: distant-signal
    # Prefer an existingSecret in a real deployment (External Secrets
    # Operator, Vault, SOPS) over an inline value in a values file:
    #   existingSecret: distant-signal-sso
    clientSecret: replace-with-your-oidc-client-secret
    redirectUrl: https://status.example.com/api/auth/callback
    postLoginRedirectUrl: https://status.example.com/
  sessionTtlDays: 14
  sessionMaxAgeDays: 90
  sessionExtendThrottleHours: 24
  # Internal-service OAuth2 (machine-to-machine, distinct from sso above):
  # only the Distant-Signal-MCP's token is verified, to give it its own
  # rate-limit budget (api.internalOauth.groups.mcp). Release B (ingest
  # phase 5) removed the producers' /private routes and credentials.
  internalOauth:
    issuerUrl: https://sso.example.com/application/o/distant-signal-internal/
    clientId: distant-signal-internal
  # resources: deliberately not overridden (values.yaml's 512Mi/1Gi default;
  # see its comment).

aggregator:
  pollIntervalSecs: 60
  historyRetentionDays: 30
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# The bundled Redis is deliberately left at its defaults (`enabled: true`,
# `persistence.enabled: true`). It backs two Redis Streams: enricher's
# incident-text-changed (losing it costs nothing but promptness, since
# enricher's hourly sweep re-finds anything a dropped event would have
# triggered) and movement-relay's movement-events (the sole transport to
# its consumer groups, no replay source behind it -- see README.md's "Using
# an external Redis" for the incident that made persistence the default
# here). Set `redis.enabled: false` together with `redis.externalUrl` to
# point at a managed instance instead.
#
# Since release A (2026-10-09), and with no HTTP path left since release B,
# the stream producers (poller-ldbws,
# poller-tfl, poller-tocs, full-coverage-consumer, and the island-of-Ireland
# pollers enabled below) XADD to their own ds:ingest:* streams and the
# ingest-writer applies them, so every client connects as its own narrow
# ACL user and no client has `default`'s password (security review H3;
# docs/redis-acl.md, steps 1-4): the ACL users at stage `narrow`, one
# client per Redis user, and `defaultUser: "on-unshared"` (default on with
# its own password, a `default-password` key in the users Secret).
# redis.auth stays for the rollout's earlier steps. Both Secrets are yours
# to create.
redis:
  auth:
    enabled: true
    existingSecret: distant-signal-redis-auth
  acl:
    enabled: true
    existingSecret: distant-signal-redis-users
    stage: narrow
    defaultUser: "on-unshared"
    clients:
      api: true
      enricher: true
      movementRelay: true
      trustConsumer: true
      fullCoverageConsumer: true
      trustBacklogConsumer: true
      ingestWriter: true
      pollerIncidents: true
      pollerLdbws: true
      pollerTfl: true
      pollerTocs: true
      pollerIrishRailGtfs: true
      pollerIrishRailLive: true
      pollerNirStations: true

# The ingest-writer (required since release B): it applies the streams
# above and runs the train-domain loops that poller-stations' and
# trust-consumer's direct writes rely on.
ingestWriter:
  enabled: true
  loops:
    enabled: true
  # The island-of-Ireland pollers enabled below each XADD to their own
  # stream; the render fails unless the writer applies it.
  streams:
    ioi-gtfs: apply
    ioi-nir: apply
    ioi-live: apply

enricher:
  llm:
    # Both of these are REQUIRED -- leaving either empty aborts the render
    # (see templates/enricher-deployment.yaml). Any OpenAI-compatible
    # chat-completions endpoint works, including a self-hosted one.
    baseUrl: https://llm.example.com/v1
    model: replace-me-model-name
    # Empty is valid for a local endpoint that requires no auth.
    apiKey: replace-me-llm-api-key
  sweepIntervalSecs: 3600
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

postgresql:
  enabled: true
  auth:
    username: distant_signal
    database: distant_signal
    # Left empty on purpose: generated on first install and preserved across
    # upgrades. Set `existingSecret` instead if an external secret manager
    # owns this credential.
    password: ""
  persistence:
    enabled: true
    size: 20Gi
    storageClass: fast-ssd
  # Since release A (2026-10-09) the direct (db) producers connect only as
  # their own narrow roles (docs/postgres-app-role.md): the separate roles,
  # the setup Job that creates them, and the per-service roles (every
  # service connects as its own role; the shared `app` role was dropped in
  # release E). Their passwords are generated into the chart's Secret
  # unless you set each role's existingSecret.
  roles:
    enabled: true
    setupJob:
      enabled: true
    perService:
      enabled: true
  # The per-role CONNECTION LIMITs (two api replicas, the writer and the
  # four direct producers) sum to 117, over the 97 that Postgres's default
  # max_connections 100 leaves; the render refuses that (spec §6.6). 200 is
  # what production runs at the default 5Gi limit (checked 2026-10-08).
  config:
    max_connections: 200
  # resources, other config and shm are deliberately not overridden: values.yaml's
  # defaults (3Gi/5Gi, shared_buffers 1GB, a 1Gi /dev/shm) are sized
  # together, and its random_page_cost 1.1 already suits this SSD class.
  # If you lower the memory limit, scale shared_buffers,
  # effective_cache_size and shm.sizeLimit down with it (see values.yaml's
  # `postgresql.config` comment). Any config change restarts Postgres.

pollers:
  incidents:
    enabled: true
    baseUrl: https://rdm.example.com/incidents
    apiKey: replace-me-rdm-incidents-key
    pollIntervalSecs: 300
  stations:
    enabled: true
    baseUrl: https://rdm.example.com/json/1.0
    apiKey: replace-me-rdm-stations-key
    pollIntervalSecs: 86400
  tocs:
    enabled: true
    baseUrl: https://rdm.example.com/tocs
    apiKey: replace-me-rdm-tocs-key
    pollIntervalSecs: 86400
  ldbws:
    enabled: true
    baseUrl: https://rdm.example.com/LDBWS/api/20220120
    apiKey: replace-me-rdm-ldbws-key
    numRows: 10
    pollIntervalSecs: 60
  tfl:
    enabled: true
    # No `baseUrl` override here, unlike the RDM pollers above: TfL's
    # Unified API is a real, public, documented endpoint, so
    # `values.yaml`'s default (`https://api.tfl.gov.uk`) is already correct.
    apiKey: replace-me-tfl-app-key
    pollIntervalSecs: 300

# The Irish Rail GTFS feed. CI renders it enabled here (the helm-lint job).
# No apiKey field, unlike the RDM pollers above: this feed needs none.
pollerIrishRailGtfs:
  enabled: true

# The Irish Rail live feed. CI renders it enabled here (the helm-lint job).
# No apiKey field, unlike the RDM pollers above: this feed needs none.
pollerIrishRailLive:
  enabled: true

pollerNirStations:
  enabled: true

# RDM Train Movements (Kafka). movement-relay is on by default and is the
# only Kafka client; with movementRelay.kafka.* left empty it uses these
# values and this credential. REQUIRED unless movementRelay.enabled=false.
trustConsumer:
  kafka:
    brokers: kafka.example.com:9092
    topic: TRAIN_MVT_ALL_TOC
    # The RDM-issued group id. RDM issues one per account, and
    # movement-relay holds it.
    consumerGroup: SC-replace-me-rdm-consumer-group
    saslMechanism: PLAIN
    saslUsername: replace-me-rdm-kafka-username
    saslPassword: replace-me-rdm-kafka-password

metrics:
  podMonitor:
    # Needs the Prometheus Operator's monitoring.coreos.com CRDs at install
    # time. CI renders it enabled here; helm template doesn't validate
    # against a live API server, so no CRDs are needed to render.
    enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  frontend:
    enabled: true
    host: status.example.com
  api:
    # Left off deliberately: the frontend reaches the api in-cluster.
    enabled: false
    host: ""
  tls:
    - secretName: distant-signal-tls
      hosts:
        - status.example.com

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
