name: Sync core

# Re-vendor ds-core's access files on Renovate's ds-core branches (repo
# split spec §5.1). Renovate's ds-core group bumps core-version and the
# ds-migrate image, but the hosted Renovate app runs no postUpgradeTasks,
# so it can't run scripts/sync-core.py itself, and ci.yml's
# `sync-core.py --check` would keep the PR red. This workflow runs the
# sync on every push to such a branch and, when the vendored files
# changed, commits and pushes them back to the same branch. CI then runs
# on that commit and the PR can automerge when green.
#
# Two jobs, so the branch's code never sees the write token. `sync` has
# read-only permissions and no App token: it checks the branch out without
# persisting any credentials, runs scripts/sync-core.py (branch code, and
# uv's locked dependencies) and hands the resulting diff of the vendored
# paths over as an artifact. `push` runs none of the branch's code: it mints
# the token, checks the same commit out, refuses a patch that renames,
# deletes, changes a mode or touches anything but the six vendored files,
# applies it, then runs the default branch's copy of scripts/sync-core.py
# --check over the result (the sync job's script is the branch's, so its
# word is not taken: every file must be ds-core's cosign-verified asset)
# and pushes. The workflow's own permissions are none; each job asks for
# what it needs.
#
# This guards against the branch's *scripts*. A push event runs the
# workflow file of the pushed commit, so anyone who can push a
# renovate/ds-core* branch can also edit this file; that needs write
# access, and is bounded by the App's limits below (no `workflows`
# permission, so no .github/ changes; ruleset-held to renovate/*).
#
# The push uses an installation token of the `ds-deploy-sync` GitHub App,
# not GITHUB_TOKEN: a GITHUB_TOKEN push starts no workflows, so the
# checks would never run on the new commit. The App:
#   - is installed on Distant-Signal/ds-deploy only;
#   - has Contents: read and write and Metadata: read, nothing else;
#   - is held to renovate/* branches by the repository ruleset "Sync bot:
#     Renovate branches only" (every branch but renovate/**: creation,
#     update and deletion restricted; bypass: the Repository admin role
#     and the Renovate app, not ds-deploy-sync), on top of "Protect main";
#   - and this job pushes only to the branch it was started on, which the
#     trigger limits to renovate/ds-core*.
# Its ID and private key are the repository secrets DS_DEPLOY_SYNC_APP_ID
# and DS_DEPLOY_SYNC_PRIVATE_KEY. renovate.json5's gitIgnoredAuthors lists
# its commit email, so Renovate keeps owning (rebasing, automerging) the
# branch after the bot's commit.
#
# Loops: the bot's push starts this workflow again, which finds nothing
# to change and stops.

on:
  push:
    branches:
      - "renovate/ds-core*"

concurrency:
  group: sync-core-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    name: re-vendor ds-core's access files
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Checkout the Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Re-vendor from the core-version release (verified)
        run: uv run --locked --no-default-groups scripts/sync-core.py

      - name: The diff of the vendored files
        id: patch
        run: |
          set -euo pipefail
          git add -- charts/distant-signal/files scripts/render-redis-acl.py
          if git diff --cached --quiet; then
            echo "The vendored files already match core-version's release."
            echo "changed=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          mkdir "${RUNNER_TEMP}/sync-patch"
          git diff --cached --binary >"${RUNNER_TEMP}/sync-patch/sync-core.patch"
          echo "changed=true" >>"${GITHUB_OUTPUT}"

      - name: Upload the patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync-core-patch
          path: ${{ runner.temp }}/sync-patch/sync-core.patch
          if-no-files-found: error
          retention-days: 1

  push:
    name: push the vendored files
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    # The ds-deploy-sync App token below is the only credential; this job
    # runs none of the branch's code.
    permissions: {}
    steps:
      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync-core-patch
          path: ${{ runner.temp }}/sync-patch

      - name: Mint the ds-deploy-sync token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DS_DEPLOY_SYNC_APP_ID }}
          private-key: ${{ secrets.DS_DEPLOY_SYNC_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout the same commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app.outputs.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Apply the patch (vendored paths only)
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PATCH: ${{ runner.temp }}/sync-patch/sync-core.patch
          SHA: ${{ github.sha }}
          TRUSTED: ${{ runner.temp }}/trusted-sync-core.py
        run: |
          set -euo pipefail
          if [[ ! "${BRANCH}" =~ ^renovate/ds-core ]]; then
            echo "::error::refusing to push to ${BRANCH}" >&2
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          if [[ "${head}" != "${SHA}" ]]; then
            echo "::error::checked out ${head}, not ${SHA}" >&2
            exit 1
          fi
          # Reject renames, copies, mode changes and symlinks before they
          # touch the tree. `git apply` itself refuses paths outside the
          # repository and writes through symlinks.
          git apply --summary "${PATCH}" >"${RUNNER_TEMP}/summary"
          if grep -vqE '^ create mode 100644 ' "${RUNNER_TEMP}/summary"; then
            echo "::error::the patch renames, copies, deletes or changes a mode" >&2
            cat "${RUNNER_TEMP}/summary" >&2
            exit 1
          fi
          git apply --index "${PATCH}"
          # The paths come from the index after the apply, not from parsing
          # the patch: the files scripts/sync-core.py owns, nothing else
          # (a case-insensitive or renamed path cannot match).
          git diff --cached --raw --no-renames -z >"${RUNNER_TEMP}/raw"
          count=0
          while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
            read -r old new _ _ status <<<"${meta}"
            old="${old#:}"
            case "${path}" in
              charts/distant-signal/files/db-grants.yaml | \
                charts/distant-signal/files/postgres-grants.sql | \
                charts/distant-signal/files/postgres-roles.sql | \
                charts/distant-signal/files/postgres-roles-setup.sh | \
                charts/distant-signal/files/redis-users.acl.tpl | \
                scripts/render-redis-acl.py) ;;
              *)
                echo "::error::the patch touches ${path}, outside the vendored files" >&2
                exit 1
                ;;
            esac
            case "${status}:${old}:${new}" in
              M:100644:100644 | M:100755:100755 | A:000000:100644) ;;
              *)
                echo "::error::${path}: ${status} ${old} ${new} is not a plain file edit" >&2
                exit 1
                ;;
            esac
            count=$((count + 1))
          done <"${RUNNER_TEMP}/raw"
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::the patch changes nothing" >&2
            exit 1
          fi
          # Independently of the sync job: the trusted copy of the sync
          # script (the default branch's, not this branch's) checks that
          # every vendored file is byte for byte ds-core's signed release
          # asset (cosign verify-blob), and that the pins agree.
          git fetch --depth=1 origin "${DEFAULT_BRANCH}"
          git show "FETCH_HEAD:scripts/sync-core.py" >"${TRUSTED}"
          python3 -I "${TRUSTED}" --check --root "${GITHUB_WORKSPACE}"

      - name: Commit and push the vendored files
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The branch is still where this run started: a fast-forward push
          # would refuse otherwise, this says why.
          git ls-remote origin "refs/heads/${BRANCH}" >"${RUNNER_TEMP}/tip"
          read -r tip _ <"${RUNNER_TEMP}/tip" || tip=""
          if [[ "${tip}" != "${SHA}" ]]; then
            echo "::error::${BRANCH} moved to ${tip} since ${SHA}; a newer run takes over" >&2
            exit 1
          fi
          user_id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${user_id}+${SLUG}[bot]@users.noreply.github.com"
          version="$(cat core-version)"
          git commit -m "Vendor ds-core ${version}'s access files" \
            -m "scripts/sync-core.py, from the release's signed assets."
          git push origin "HEAD:refs/heads/${BRANCH}"
