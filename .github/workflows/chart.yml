name: Chart

# Package, push and sign both charts on every push to main (repo split spec
# §5.4 step 3):
#
#   oci://ghcr.io/<owner>/charts/distant-signal    (Ranma-Config deploys it)
#   oci://ghcr.io/<owner>/charts/ds-ingest-bucket  (its Renovate rule is off)
#
# <owner> is this repository's owner, lowercased: ghcr.io/distant-signal,
# the same URL the monorepo pushed to after phase 1, so Ranma-Config's
# OCIRepository doesn't change.
#
# Versions: Distant-Signal/ci's helm-chart.yml packages
# `<Chart.yaml version>+build.<run number>.sha.<short sha>`. This
# repository's run counter started at 1, so the umbrella chart's base went
# to 0.6.0 when it took over the push (§5.4, decision 4): semver ignores
# build metadata, and a new base orders every build here above the
# monorepo's 0.5.x builds.
#
# Images: values.yaml pins every first-party image by tag and digest,
# committed by Renovate's grouped bump PRs (renovate.json5). Nothing is
# injected at package time: the packaged chart is the committed chart. The
# ordering job re-checks the pinned images' labels (scripts/release-order.py,
# §5.1 and §5.3) before anything is pushed, as ci.yml did on the PR.
#
# Signing: each chart is signed by digest in its own job, in THIS workflow,
# so the Fulcio certificate's identity is
#   https://github.com/Distant-Signal/ds-deploy/.github/workflows/chart.yml@refs/heads/main
# which Flux's `matchOIDCIdentity` subject regex in Ranma-Config must
# accept (§5.9). Renaming this file, or signing from a reusable workflow's
# job, changes that identity and breaks every chart fetch until
# Ranma-Config follows. The push jobs (helm-chart.yml) get no id-token;
# only the sign jobs do.

concurrency:
  # One chart push at a time, in order; never cancel a push half way.
  group: chart-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The release ordering checks against the pinned images' labels, read
  # anonymously from the registry as the cluster pulls, and the appVersion
  # for the packaged chart (`sha-<short sha>` of this commit).
  ordering:
    name: release ordering (the pinned images' labels)
    runs-on: ubuntu-26.04
    outputs:
      app-version: ${{ steps.app-version.outputs.app-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned script tools
        run: uv sync --locked --group lint

      # Rule 3 (contract migrations) reads the migrations of the ds-core
      # release core-version pins: a shallow clone of ds-core at that tag.
      - name: Release ordering checks
        run: |
          set -euo pipefail
          core="${RUNNER_TEMP}/ds-core"
          version="$(cat core-version)"
          git clone --quiet --depth 1 --branch "${version}" \
            https://github.com/Distant-Signal/ds-core "${core}"
          uv run --no-sync scripts/release-order.py check --values charts/distant-signal/values.yaml --registry \
            --migrations "${core}/crates/ds-store/migrations"

      - name: appVersion
        id: app-version
        run: echo "app-version=sha-${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"

  chart:
    needs: ordering
    uses: Distant-Signal/ci/.github/workflows/helm-chart.yml@f405ba7d7d51df62ad597f8fc1e56070abafca64 # main
    permissions:
      contents: read
      packages: write
    with:
      chart: charts/distant-signal
      lint-values: charts/distant-signal/values-example.yaml
      app-version: ${{ needs.ordering.outputs.app-version }}
      publish: true

  sign-chart:
    name: Sign and verify the pushed chart
    needs: chart
    if: needs.chart.outputs.digest != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless/OIDC signing
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log into ghcr.io (cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and verify
        uses: Distant-Signal/ci/actions/cosign-sign@f405ba7d7d51df62ad597f8fc1e56070abafca64 # main
        with:
          ref: ${{ needs.chart.outputs.ref }}@${{ needs.chart.outputs.digest }}
          verify-identity: ${{ github.server_url }}/${{ github.workflow_ref }}

  ingest-bucket:
    uses: Distant-Signal/ci/.github/workflows/helm-chart.yml@f405ba7d7d51df62ad597f8fc1e56070abafca64 # main
    permissions:
      contents: read
      packages: write
    with:
      chart: charts/ds-ingest-bucket
      lint-values: charts/ds-ingest-bucket/ci/example-values.yaml
      publish: true

  sign-ingest-bucket:
    name: Sign and verify the pushed chart (ds-ingest-bucket)
    needs: ingest-bucket
    if: needs.ingest-bucket.outputs.digest != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless/OIDC signing
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log into ghcr.io (cosign)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and verify
        uses: Distant-Signal/ci/actions/cosign-sign@f405ba7d7d51df62ad597f8fc1e56070abafca64 # main
        with:
          ref: ${{ needs.ingest-bucket.outputs.ref }}@${{ needs.ingest-bucket.outputs.digest }}
          verify-identity: ${{ github.server_url }}/${{ github.workflow_ref }}
